{{~it.items :item}}

<div class="sp-item">

    <div class="sp-field-row">
        <input
                class="sp-title"
                placeholder="Текст кнопки"
                type="text"
                value="{{!item.title}}"
        />
    </div>


    <div class="sp-field-row">
        <input
                class="sp-url"
                placeholder="Ссылка"
                type="text"
                value="{{!item.url}}"
        />
    </div>


    <!-- ИКОНКА -->
    <div
            class="sp-field-row sp-file-field"
            data-type="icon"
    >

        <div class="sp-file-source sp-clear">

            <input
                    class="sp-download-url"
                    title="Укажите прямую https-ссылку на изображение"
                    type="text"
                    placeholder="Скачать иконку по ссылке"
            >

            <span class="sp-note">или</span>

            <div class="sp-x-btn sp-x-btn-file">
                <label>Загрузить иконку</label>
                <input type="file" name="file" accept="image/*">
            </div>

            <div class="sp-file-errors"></div>

        </div>


        <div class="sp-file-edit sp-clear">

            <input
                    placeholder="Описание"
                    class="sp-item-file-description"
                    type="text"
                    value="{{!item.icon.DESCRIPTION}}"
            >

            <span class="sp-note">или</span>

            <span class="sp-x-btn sp-item-file-del">
                Удалить
            </span>

        </div>


        <div class="sp-file-result sp-clear"></div>

    </div>


    <!-- КАРТИНКА -->
    <div
            class="sp-field-row sp-file-field"
            data-type="image"
    >

        <div class="sp-file-source sp-clear">

            <input
                    class="sp-download-url"
                    title="Укажите прямую https-ссылку на изображение"
                    type="text"
                    placeholder="Скачать изображение по ссылке"
            >

            <span class="sp-note">или</span>

            <div class="sp-x-btn sp-x-btn-file">
                <label>Загрузить картинку</label>
                <input type="file" name="file" accept="image/*">
            </div>

            <div class="sp-file-errors"></div>

        </div>


        <div class="sp-file-edit sp-clear">

            <input
                    placeholder="Описание"
                    class="sp-item-file-description"
                    type="text"
                    value="{{!item.image.DESCRIPTION}}"
            >

            <span class="sp-note">или</span>

            <span class="sp-x-btn sp-item-file-del">
                Удалить
            </span>

        </div>


        <div class="sp-file-result sp-clear"></div>

    </div>


    <!-- TARGET -->
    <div class="sp-field-row">

        <select class="sp-target">

            {{~it.targets :target}}

            <option
                    value="{{=target.value}}"
                    {{?target.value == item.target}}selected="selected"{{?}}
            >
                {{=target.name}}
            </option>

            {{~}}

        </select>

    </div>

</div>

{{~}}
